name: Foundation checks

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, pdo_sqlite, sqlite3, bcmath
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Setup application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Lint PHP application files
        run: find app routes database/migrations -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Compile Blade templates
        run: php artisan view:cache
      - name: Verify Phase 9 API routes
        run: vendor/bin/phpunit --no-progress --filter=Phase9ApiRoutesTest
      - name: Verify Phase 9 device workflows
        run: vendor/bin/phpunit --no-progress --filter=Phase9DeviceIntegrationTest
      - name: Run feature tests
        run: vendor/bin/phpunit --no-progress --display-errors --display-warnings
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend assets
        run: |
          npm install --no-audit --no-fund
          npm run build

  desktop-webview:
    name: Desktop React typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install desktop dependencies
        run: npm install --prefix desktop --no-audit --no-fund
      - name: Typecheck and bundle desktop UI
        run: npm run build --prefix desktop

  desktop-windows:
    name: Build Windows POS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Generate Windows app icons
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/app-icon.svg
      - name: Build Tauri NSIS installer
        working-directory: desktop
        run: npm run build:desktop
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: pos-cloud-desktop-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  mysql-migrations:
    name: MySQL 8.4 migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: pos_cloud_ci
          MYSQL_USER: posci
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pos_cloud_ci
      DB_USERNAME: posci
      DB_PASSWORD: testpass
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP with MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, pdo_mysql, bcmath
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run all migrations on MySQL
        run: |
          php artisan config:clear
          php artisan migrate --force
          php artisan migrate:status
