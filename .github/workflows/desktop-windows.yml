name: Windows POS Desktop Installer

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Generate Windows icons
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/app-icon.svg
      - name: Build NSIS installer
        working-directory: desktop
        run: npm run build:desktop
      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: pos-cloud-desktop-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
